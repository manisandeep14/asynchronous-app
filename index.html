<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<div class="app">

    <div class="search-box">

        <input
            type="text"
            id="cityInput"
            placeholder="Search city..."
        >

        <button id="searchBtn">
            Search
        </button>

    </div>

    <div id="loading" class="loading hidden">
        Fetching Weather...
    </div>

    <div id="error" class="error hidden">
        City Not Found
    </div>

    <div class="weather-card">

        <div class="top">

            <h2 id="cityName">
                City Name
            </h2>

            <div>
                <img class="icon" id="weatherIcon"  src="" alt=""/>
            </div>
        </div>

        <div class="temperature">
            <span id="temp">
                28°
            </span>
        </div>

        <p id="condition">
            Clear Sky
        </p>

        <div class="stats">

            <div class="stat">
                <h4>Humidity</h4>
                <p id="humidity">65%</p>
            </div>

            <div class="stat">
                <h4>Wind</h4>
                <p id="wind">12 km/h</p>
            </div>

            <div class="stat">
                <h4>Feels Like</h4>
                <p id="feelsLike">31°</p>
            </div>

        </div>

    </div>

    <div class="history">

        <h3>Recent Searches</h3>

        <ul id="historyList">

        </ul>

    </div>

</div>

<script src="index.js"></script>

</body>
</html>
